# Install this file inside the existing TLS server block on the controlled relay.
# The relay never stores Ark credentials; the upstream Authorization header is
# forwarded only for requests originating from the OwnMinutes application host.
location = /ownminutes-ark/api/v3/chat/completions {
    allow 192.0.2.10;
    deny all;

    limit_except POST {
        deny all;
    }

    client_max_body_size 8m;
    access_log off;

    proxy_pass https://ark.cn-beijing.volces.com/api/v3/chat/completions;
    proxy_set_header Host ark.cn-beijing.volces.com;
    proxy_ssl_server_name on;
    proxy_ssl_name ark.cn-beijing.volces.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_connect_timeout 8s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
