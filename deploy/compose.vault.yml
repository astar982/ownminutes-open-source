services:
  app:
    environment: &vault-environment
      OWNMINUTES_SECRET_STORE: vault-transit
      OWNMINUTES_VAULT_ADDR: ${OWNMINUTES_VAULT_ADDR:?OWNMINUTES_VAULT_ADDR is required}
      OWNMINUTES_VAULT_TRANSIT_KEY: ${OWNMINUTES_VAULT_TRANSIT_KEY:?OWNMINUTES_VAULT_TRANSIT_KEY is required}
      OWNMINUTES_VAULT_TRANSIT_MOUNT: ${OWNMINUTES_VAULT_TRANSIT_MOUNT:-transit}
      OWNMINUTES_VAULT_NAMESPACE: ${OWNMINUTES_VAULT_NAMESPACE:-}
      OWNMINUTES_VAULT_TOKEN_FILE: /run/secrets/vault_token
      OWNMINUTES_SECRET_ROTATION_POLICY: ${OWNMINUTES_SECRET_ROTATION_POLICY:?OWNMINUTES_SECRET_ROTATION_POLICY is required}
      OWNMINUTES_SECRET_AUDIT_LOG: ${OWNMINUTES_SECRET_AUDIT_LOG:?OWNMINUTES_SECRET_AUDIT_LOG is required}
      OWNMINUTES_TENANT_SCOPED_KEYS: ${OWNMINUTES_TENANT_SCOPED_KEYS:?OWNMINUTES_TENANT_SCOPED_KEYS is required}
      OWNMINUTES_SECRET_DELETION_PROOF: ${OWNMINUTES_SECRET_DELETION_PROOF:?OWNMINUTES_SECRET_DELETION_PROOF is required}
      OWNMINUTES_SECRET_ADMIN_ACCESS_POLICY: ${OWNMINUTES_SECRET_ADMIN_ACCESS_POLICY:?OWNMINUTES_SECRET_ADMIN_ACCESS_POLICY is required}
      OWNMINUTES_SECRET_LOCAL_SECRET_DECISION: ${OWNMINUTES_SECRET_LOCAL_SECRET_DECISION:?OWNMINUTES_SECRET_LOCAL_SECRET_DECISION is required}
      OWNMINUTES_SECRET_DECRYPT_FAILURE_AUDIT: ${OWNMINUTES_SECRET_DECRYPT_FAILURE_AUDIT:?OWNMINUTES_SECRET_DECRYPT_FAILURE_AUDIT is required}
      OWNMINUTES_SECRET_BACKUP_RECOVERY_POLICY: ${OWNMINUTES_SECRET_BACKUP_RECOVERY_POLICY:?OWNMINUTES_SECRET_BACKUP_RECOVERY_POLICY is required}
    secrets:
      - vault_token

  worker-1:
    environment:
      <<: *vault-environment
    secrets:
      - vault_token

  worker-2:
    environment:
      <<: *vault-environment
    secrets:
      - vault_token

secrets:
  vault_token:
    file: ${OWNMINUTES_VAULT_TOKEN_FILE:?OWNMINUTES_VAULT_TOKEN_FILE is required}
