name: Bug report
description: Report a reproducible OwnMinutes defect using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, real recordings, transcripts, user data, or private infrastructure details. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: Commit SHA or app version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide safe steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device/simulator, Node/npm, browser, and deployment mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Optional. Remove secrets, URLs, identifiers, and user content first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, private recordings, transcripts, user data, and internal infrastructure details.
          required: true
        - label: This is not a security vulnerability.
          required: true
