version: 2
updates:
  # Split patch and minor groups so one breaking 0.x / SDK minor cannot
  # poison an otherwise safe patch PR. Majors stay ignored.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      root-patch:
        update-types:
          - patch
      root-minor:
        update-types:
          - minor
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 0.x minors (RN 0.85 → 0.87) and Expo SDK / IAP minors are breaking
      # for this app. Keep them out of automatic grouped updates.
      - dependency-name: "react-native"
        update-types:
          - version-update:semver-minor
      - dependency-name: "expo"
        update-types:
          - version-update:semver-minor
      - dependency-name: "expo-iap"
        update-types:
          - version-update:semver-minor
    groups:
      mobile-patch:
        update-types:
          - patch
      mobile-minor:
        update-types:
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions-patch:
        update-types:
          - patch
      actions-minor:
        update-types:
          - minor
