name: Verify OwnMinutes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Incremental PR routing is safe only when every head SHA gets its own run.
  # Ref-scoped concurrency can cancel an intermediate mobile/dependency run and
  # let a later docs-only delta skip those gates entirely.
  group: ownminutes-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      code: ${{ steps.classify.outputs.code }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      mobile: ${{ steps.classify.outputs.mobile }}
      mobile_checks: ${{ steps.classify.outputs.mobile_checks }}
      backend: ${{ steps.classify.outputs.backend }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/ownminutes-changed-files.txt"
          : > "$changed_files"
          force_full=0

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            force_full=1
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            head_sha="$PR_HEAD_SHA"
            base_sha="$PR_BASE_SHA"

            if [[ "$EVENT_ACTION" == "synchronize" && "$EVENT_BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$EVENT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              base_sha="$EVENT_BEFORE_SHA"
            fi

            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              force_full=1
            else
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$base_sha" || force_full=1
              fi
              if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$head_sha" || force_full=1
              fi
              if [[ "$force_full" == "0" ]]; then
                git diff --name-only --diff-filter=ACMRD "$base_sha" "$head_sha" > "$changed_files"
              fi
            fi
          else
            force_full=1
          fi

          classify_args=(--files-from "$changed_files" --output "$GITHUB_OUTPUT")
          if [[ "$force_full" == "1" ]]; then
            classify_args+=(--force-full)
          fi
          node scripts/classify-ci-changes.mjs "${classify_args[@]}"

      - name: Publish routing summary
        env:
          FULL: ${{ steps.classify.outputs.full }}
          CODE: ${{ steps.classify.outputs.code }}
          DEPENDENCIES: ${{ steps.classify.outputs.dependencies }}
          MOBILE: ${{ steps.classify.outputs.mobile }}
          MOBILE_CHECKS: ${{ steps.classify.outputs.mobile_checks }}
          BACKEND: ${{ steps.classify.outputs.backend }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo "## CI routing"
            echo
            echo "- changed files: $CHANGED_COUNT"
            echo "- full gate: $FULL"
            echo "- code gate: $CODE"
            echo "- dependency audit: $DEPENDENCIES"
            echo "- native iOS: $MOBILE"
            echo "- mobile contracts: $MOBILE_CHECKS"
            echo "- backend and production-like: $BACKEND"
            echo "- documentation only: $DOCS_ONLY"
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.8.0

      - name: Audit web runtime dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high --registry=https://registry.npmjs.org

      - name: Audit mobile runtime dependencies
        run: npm run smoke:mobile-audit-policy && npm run audit:mobile-runtime

  verify:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TRANSCRIPTION_PROVIDER: mock
      OWNMINUTES_APP_SECRET: ci-only-secret-not-for-production-0123456789
      OWNMINUTES_SUPPORT_EMAIL: support@ownminutes.app
      SMOKE_BASE_URL: http://127.0.0.1:3002
      SMOKE_BROWSER_ORIGIN: http://localhost:3002

    steps:
      - name: Validate CI route
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          if [[ "$CODE" != "true" && "$DOCS_ONLY" != "true" ]]; then
            echo "The CI classifier produced no safe verification route." >&2
            exit 1
          fi
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Documentation-only update: heavy verification is intentionally skipped."
          fi

      - name: Check out repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Use the repository npm version
        if: needs.changes.outputs.code == 'true'
        run: npm install --global npm@11.8.0

      - name: Install web dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Install mobile dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm --prefix apps/mobile ci

      - name: Install audio tools
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile_checks == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Type-check web and mobile
        if: needs.changes.outputs.code == 'true'
        run: |
          npm run typecheck
          npm run mobile:typecheck

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: npm run lint -- --max-warnings=0

      - name: Build production web app
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      - name: Verify CI routing contracts
        if: needs.changes.outputs.code == 'true'
        run: npm run smoke:ci-routing

      - name: Verify public snapshot guardrails
        if: needs.changes.outputs.code == 'true'
        run: |
          if [[ -e docs/internal/open-source-publication-audit.md ]]; then
            echo "Private source tree detected; public snapshot guardrails run after the internal-only files are removed."
          else
            npm run open-source:check -- --repository "$GITHUB_REPOSITORY"
          fi

      - name: Verify launch billing and lifetime trial migrations
        if: needs.changes.outputs.backend == 'true'
        run: |
          npm run smoke:database-schema
          npm run smoke:database-migrate
          npm run smoke:database-migration-policy
          npm run smoke:database-export
          npm run smoke:lifetime-free-trial
          npm run smoke:lifetime-free-trial-postgres
          npm run smoke:iap-lifecycle
          npm run smoke:iap-preflight
          npm run smoke:iap-verifier
          npm run smoke:iap-postgres

      - name: Verify generated mobile brand assets
        if: needs.changes.outputs.mobile == 'true'
        run: |
          npm run mobile:brand:generate
          git diff --exit-code -- apps/mobile/assets

      - name: Run infrastructure checks
        if: needs.changes.outputs.backend == 'true'
        run: |
          npm run smoke:container
          npm run smoke:production-deployment
          npm run smoke:minio-cleanup-policy
          npm run smoke:backend-security
          npm run smoke:deployment-preflight
          npm run smoke:testflight-preflight
          npm run smoke:production-backup
          npm run smoke:production-backup-offsite
          npm run smoke:secret-preflight
          npm run smoke:secret-vault-runtime
          npm run smoke:secret-vault-repository
          npm run smoke:secret-vault-live-verifier
          npm run smoke:secret-audit-rotation
          npm run smoke:admin-bootstrap
          npm run smoke:auth-client-identity
          npm run smoke:meeting-errors
          npm run smoke:storage-remote
          npm run smoke:meeting-write-coordination
          npm run smoke:finalization-queue
          npm run smoke:audio-normalization
          npm run smoke:audio-upload-policy
          npm run smoke:recording-duration-authority
          npm run smoke:asr-turbo-cost-policy
          npm run smoke:summary-only-reprocess
          npm run smoke:no-speech-presentation
          npm run smoke:asr-resilience
          npm run smoke:asr-benchmark
          npm run smoke:asr-acceptance
          npm run smoke:asr-meeting-batch
          npm run smoke:asr-acceptance-evidence
          npm run smoke:mobile-realtime-queue
          npm run smoke:mobile-recording-soak
          npm run smoke:provider-closed-loop-script
          npm run smoke:realtime-protocol
          npm run smoke:realtime-live-script
          npm run smoke:testflight-config
          npm run smoke:ios-local-testflight-script
          npm run smoke:ios-device-acceptance-script
          npm run smoke:ios-appstore-upload
          npm run smoke:appstore-submission
          npm run smoke:ios-appstore-compliance
          npm run smoke:ios-native-build-script
          npm run smoke:ios-testflight-evidence
          npm run smoke:ios-testflight-runbook

      - name: Run isolated application smokes
        if: needs.changes.outputs.backend == 'true'
        run: |
          npm run smoke:email-verification
          npm run smoke:obsidian-vault

      - name: Start isolated application smoke server
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile_checks == 'true'
        run: |
          OWNMINUTES_CI_AUTH_DIR=$(mktemp -d)
          nohup env OWNMINUTES_AUTH_REPOSITORY=local-file OWNMINUTES_AUTH_DATA_DIR="$OWNMINUTES_CI_AUTH_DIR" OWNMINUTES_ALLOW_FIRST_USER_ADMIN=1 OWNMINUTES_ALLOW_LOCAL_AUTH_TOKEN_RESPONSE=1 OWNMINUTES_TRUST_LOOPBACK_PROXY_HEADERS=1 OWNMINUTES_ALLOW_LOCAL_PROVIDER_ENDPOINTS=1 OWNMINUTES_ALLOW_UNSAFE_ARK_LOOPBACK_TEST=1 npm run dev -- --hostname 127.0.0.1 --port 3002 > /tmp/ownminutes-ci-server.log 2>&1 &
          echo $! > /tmp/ownminutes-ci-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3002/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ownminutes-ci-server.log
          exit 1

      - name: Run mobile-only contract checks
        if: needs.changes.outputs.mobile_checks == 'true' && needs.changes.outputs.backend != 'true'
        run: |
          npm run smoke:audio-normalization
          npm run smoke:audio-upload-policy
          npm run smoke:recording-duration-authority
          npm run smoke:summary-only-reprocess
          npm run smoke:no-speech-presentation
          npm run smoke:asr-resilience
          npm run smoke:mobile-realtime-queue
          npm run smoke:mobile-recording-soak
          npm run smoke:testflight-config
          npm run smoke:ios-local-testflight-script
          npm run smoke:ios-device-acceptance-script
          npm run smoke:ios-appstore-upload
          npm run smoke:appstore-submission
          npm run smoke:ios-appstore-compliance
          npm run smoke:ios-native-build-script
          npm run smoke:ios-testflight-evidence
          npm run smoke:ios-testflight-runbook
          npm run smoke:mobile-storefront
          npm run smoke:mobile-iap-replay
          npm run smoke:mobile-share-expiry
          npm run smoke:mobile-draft-lifecycle
          npm run smoke:recording-resume
          npm run smoke:recording-upload-resources
          npm run smoke:mobile-ui
          npm run smoke:mobile-stability
          npm run smoke:mobile-realtime
          npm run smoke:mobile-recording-watchdog
          npm run smoke:mobile-recording-storage
          npm run smoke:mobile-transport
          npm run smoke:mobile-pending-sync
          npm run smoke:mobile-recording-index
          npm run smoke:mobile-offline-session
          npm run smoke:mobile-runtime-session

      - name: Run application smoke tests
        if: needs.changes.outputs.backend == 'true'
        run: |
          npm run smoke:release
          npm run smoke:app
          npm run smoke:share-truth
          npm run smoke:meeting-catalog
          npm run smoke:recording-consent
          npm run smoke:official-processing-status
          npm run smoke:account-portable-export
          npm run smoke:mobile-storefront
          npm run smoke:mobile-iap-replay
          npm run smoke:mobile-share-expiry
          npm run smoke:mobile-draft-lifecycle
          npm run smoke:auth
          npm run smoke:processing-route
          npm run smoke:recording-resume
          npm run smoke:recording-upload-resources
          npm run smoke:provider-credential-concurrency
          npm run smoke:account
          npm run smoke:settings
          npm run smoke:legal
          npm run smoke:closed-loop
          SMOKE_BASE_URL=http://127.0.0.1:3002 npm run smoke:meeting-history-errors
          npm run smoke:mobile-ui
          npm run smoke:mobile-stability
          npm run smoke:mobile-realtime
          npm run smoke:mobile-recording-watchdog
          npm run smoke:mobile-recording-storage
          npm run smoke:mobile-transport
          npm run smoke:mobile-pending-sync
          npm run smoke:mobile-recording-index
          npm run smoke:mobile-offline-session
          npm run smoke:mobile-runtime-session

      - name: Run production-like queue recovery
        if: needs.changes.outputs.backend == 'true'
        run: |
          npm run stack:up
          npm run stack:test

      - name: Stop production-like stack
        if: ${{ always() && needs.changes.outputs.backend == 'true' }}
        run: npm run stack:down || true

      - name: Print server log on failure
        if: ${{ failure() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile_checks == 'true') }}
        run: cat /tmp/ownminutes-ci-server.log || true

  ios-release:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.8.0

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix apps/mobile ci

      - name: Verify Xcode and Swift toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          read -r swift_major swift_minor <<< "$(xcrun swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)"
          if [[ -z "$swift_major" || -z "$swift_minor" || "$swift_major" -lt 6 || ( "$swift_major" -eq 6 && "$swift_minor" -lt 2 ) ]]; then
            echo "Swift 6.2 or newer is required; found ${swift_major:-unknown}.${swift_minor:-unknown}." >&2
            exit 1
          fi
          xcrun swift package \
            --package-path apps/mobile/node_modules/expo-modules-jsi/apple \
            dump-package > /dev/null

      - name: Cache CocoaPods downloads and generated Pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            apps/mobile/ios/Pods
          key: ios-pods-${{ runner.os }}-xcode-26.2-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Build unsigned native Release
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace OwnMinutes.xcworkspace \
            -scheme OwnMinutes \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
